# ─────────────────────────────────────────────────────────────
# Backend CI : PR마다 백엔드 테스트를 돌립니다.
# 테스트가 하나라도 실패하면 PR에 빨간 X가 뜨고, (브랜치 보호를 켜 두면) 머지가 막힙니다.
# ─────────────────────────────────────────────────────────────
name: Backend CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: backend-test
    runs-on: ubuntu-latest
    steps:
      - name: 코드 내려받기
        uses: actions/checkout@v7

      - name: Java 21 준비
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # 윈도우에서 커밋하면 gradlew 실행 권한이 빠지는 경우가 있어 한 번 더 붙여 줍니다.
      - name: gradlew 실행 권한
        run: chmod +x gradlew

      - name: Test
        run: ./gradlew test
