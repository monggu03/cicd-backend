# ─────────────────────────────────────────────────────────────
# Backend CD : main에 코드가 들어오면(= PR 머지)
#   1) 테스트를 한 번 더 돌리고 (needs: test)
#   2) 통과했을 때만 Cloud Run에 배포합니다.
# 사전 준비: GitHub Secret GCP_SA_KEY  (가이드 8-3 / scripts/gcp-setup.sh)
# ─────────────────────────────────────────────────────────────
name: Backend CD

on:
  push:
    branches: [main]
  workflow_dispatch: # Actions 탭에서 "Run workflow" 버튼으로 수동 실행도 가능

# 배포가 두 개 동시에 돌지 않도록 줄을 세웁니다.
concurrency:
  group: backend-cd
  cancel-in-progress: false

permissions:
  contents: read

env:
  SERVICE: gdg-cicd-api       # Cloud Run 서비스 이름
  REGION: asia-northeast3     # 서울 리전

jobs:
  test:
    name: backend-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: chmod +x gradlew
      - run: ./gradlew test

  deploy:
    name: deploy-cloud-run
    needs: test            # 테스트가 초록일 때만 배포 단계로 넘어갑니다
    runs-on: ubuntu-latest
    steps:
      - name: 코드 내려받기
        uses: actions/checkout@v7

      - name: gradlew 실행 권한
        run: chmod +x gradlew

      - name: Google Cloud 로그인 (Secrets의 서비스 계정 키 사용)
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Cloud Run 배포 (소스 → 빌드팩 → 이미지 → 새 리비전)
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          source: ./
          flags: --allow-unauthenticated

      - name: 배포 결과 남기기
        run: |
          {
            echo "### 🚀 배포 완료"
            echo "- 주소: ${{ steps.deploy.outputs.url }}"
            echo "- 커밋: ${GITHUB_SHA::7}"
          } >> "$GITHUB_STEP_SUMMARY"
